<!DOCTYPE html>
<html>
  <head>
    <title>PayPal Payment Success</title>
  </head>
  <body>
    <script>
      // Get the PayPal order ID from the URL (PayPal usually returns it as ?token=ORDER_ID)
      const params = new URLSearchParams(window.location.search);
      const orderId = params.get('token');

      // Send message to opener window
      if (window.opener && orderId) {
        window.opener.postMessage(
          { type: "PAYPAL_PAYMENT_COMPLETE", orderId },
          window.location.origin // or "*" if you want to allow any origin
        );
        setTimeout(() => window.close(), 500); // Give time for message to be received
      }
    </script>
    <h2>Thank you for your payment!</h2>
    <p>You can close this window.</p>
  </body>
</html>
