<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      ── Default metadata (overridden per-page by SEOHead / react-helmet-async) ──
      These are the fallback values shown when JS has not yet executed.
      Every real page sets its own title + description via <SEOHead>.
    -->
    <title>Invoicely — Professional Invoicing &amp; Billing Platform</title>
    <meta name="description" content="Create invoices, automate recurring billing, track payments, and manage clients in one place. Built for freelancers, agencies, and growing businesses — PDF export, email delivery, and instant payment links." />
    <meta name="author" content="Invoicely" />
    <link rel="canonical" href="https://www.getinvoicely.online" />
    <meta name="robots" content="index, follow" />

    <!-- Favicon -->
    <link rel="icon" href="/icon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon.png" />

    <!-- Google Search Console verification -->
    <meta name="google-site-verification" content="Zwb2aC5NgIDU8pBGP_iJSifKb0-u3fe2RF1JJl3fwgo" />

    <!-- Open Graph (fallback — overridden per-page by react-helmet-async) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.getinvoicely.online" />
    <meta property="og:title" content="Invoicely — Professional Invoicing &amp; Billing Platform" />
    <meta property="og:description" content="Create invoices, automate recurring billing, track payments, and manage clients in one place. Built for freelancers, agencies, and growing businesses." />
    <meta property="og:image" content="https://www.getinvoicely.online/invoicelyCover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Invoicely" />

    <!-- Twitter Card (fallback) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.getinvoicely.online" />
    <meta name="twitter:title" content="Invoicely — Professional Invoicing &amp; Billing Platform" />
    <meta name="twitter:description" content="Create invoices, automate recurring billing, track payments, and manage clients in one place. Built for freelancers, agencies, and growing businesses." />
    <meta name="twitter:image" content="https://www.getinvoicely.online/invoicelyCover.png" />

    <!--
      Structured Data — Organization + WebSite (site-level schema).
      Page-level schema (SoftwareApplication, Article, FAQPage, etc.)
      is injected per-page by react-helmet-async via SEOHead.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.getinvoicely.online/#organization",
            "name": "Invoicely",
            "url": "https://www.getinvoicely.online",
            "logo": {
              "@type": "ImageObject",
              "url": "https://www.getinvoicely.online/icon.png"
            },
            "contactPoint": {
              "@type": "ContactPoint",
              "email": "support@getinvoicely.online",
              "contactType": "customer support"
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://www.getinvoicely.online/#website",
            "url": "https://www.getinvoicely.online",
            "name": "Invoicely",
            "description": "Professional Invoicing, Recurring Billing & Client Management Platform for freelancers and businesses",
            "publisher": {
              "@id": "https://www.getinvoicely.online/#organization"
            },
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://www.getinvoicely.online/?q={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>

  </head>

  <body>
    <div id="root"></div>
    <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
